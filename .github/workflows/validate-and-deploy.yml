name: Validate and deploy Nexo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexo-main-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Build and API checks
    runs-on: ubuntu-latest
    outputs:
      deploy_required: ${{ steps.runtime_changes.outputs.deploy_required }}
      api_deploy_required: ${{ steps.runtime_changes.outputs.api_deploy_required }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Check frontend undefined references
        run: npm run lint

      - name: Stamp web build revision
        if: ${{ github.ref == 'refs/heads/main' }}
        run: printf '{"revision":"%s"}\n' "$GITHUB_SHA" > public/nexo-build.json

      - name: Build web app
        run: npm run build

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Build API
        run: npm run api:build

      - name: Run API tests
        run: npm --prefix api test

      - name: Detect runtime changes
        id: runtime_changes
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' || -z "${EVENT_BEFORE:-}" || "$EVENT_BEFORE" =~ ^0+$ ]]; then
            echo 'deploy_required=true' >> "$GITHUB_OUTPUT"
            echo 'api_deploy_required=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$EVENT_BEFORE"
          runtime_paths=(src api/src api/drizzle api/tsconfig.json api/drizzle.config.ts public index.html Dockerfile api/Dockerfile compose.yaml nginx.conf .dockerignore)
          runtime_changed='false'
          if ! git diff --quiet "$EVENT_BEFORE" "$GITHUB_SHA" -- "${runtime_paths[@]}"; then
            runtime_changed='true'
          fi
          # Lockfiles also change for development-only tools. Rebuild production only
          # when runtime dependencies or the relevant build command changed.
          for package_file in package.json api/package.json; do
            if ! git cat-file -e "$EVENT_BEFORE:$package_file" 2>/dev/null || ! test -f "$package_file"; then
              runtime_changed='true'
              continue
            fi
            before_runtime="$(git show "$EVENT_BEFORE:$package_file" | jq -cS '{dependencies: (.dependencies // {}), optionalDependencies: (.optionalDependencies // {}), peerDependencies: (.peerDependencies // {}), overrides: (.overrides // {}), build: (.scripts.build // null)}')"
            current_runtime="$(jq -cS '{dependencies: (.dependencies // {}), optionalDependencies: (.optionalDependencies // {}), peerDependencies: (.peerDependencies // {}), overrides: (.overrides // {}), build: (.scripts.build // null)}' "$package_file")"
            if [[ "$before_runtime" != "$current_runtime" ]]; then
              runtime_changed='true'
            fi
          done
          if [[ "$runtime_changed" == 'false' ]]; then
            echo 'deploy_required=false' >> "$GITHUB_OUTPUT"
            echo 'api_deploy_required=false' >> "$GITHUB_OUTPUT"
            echo 'No runtime files changed; production deploy verification is not required.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'deploy_required=true' >> "$GITHUB_OUTPUT"
            api_paths=(api/src api/drizzle api/tsconfig.json api/drizzle.config.ts api/Dockerfile compose.yaml)
            api_runtime_changed='false'
            if ! git diff --quiet "$EVENT_BEFORE" "$GITHUB_SHA" -- "${api_paths[@]}"; then
              api_runtime_changed='true'
            fi
            before_api_runtime="$(git show "$EVENT_BEFORE:api/package.json" | jq -cS '{dependencies: (.dependencies // {}), optionalDependencies: (.optionalDependencies // {}), peerDependencies: (.peerDependencies // {}), overrides: (.overrides // {}), build: (.scripts.build // null)}')"
            current_api_runtime="$(jq -cS '{dependencies: (.dependencies // {}), optionalDependencies: (.optionalDependencies // {}), peerDependencies: (.peerDependencies // {}), overrides: (.overrides // {}), build: (.scripts.build // null)}' api/package.json)"
            if [[ "$before_api_runtime" != "$current_api_runtime" ]]; then
              api_runtime_changed='true'
            fi
            if [[ "$api_runtime_changed" == 'false' ]]; then
              echo 'api_deploy_required=false' >> "$GITHUB_OUTPUT"
              echo 'Only web/runtime files changed; the deployed API revision may remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'api_deploy_required=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Record revision for Coolify auto deploy
        if: ${{ github.ref == 'refs/heads/main' && steps.runtime_changes.outputs.deploy_required == 'true' }}
        run: |
          set -euo pipefail
          printf '{"revision":"%s"}\n' "$GITHUB_SHA" > public/nexo-build.json
          if git diff --quiet -- public/nexo-build.json; then
            echo 'Deployment revision already recorded.' >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/nexo-build.json
            git commit -m "chore: record deploy revision $GITHUB_SHA [skip ci]"
            git push origin HEAD:main
            echo "Coolify auto deploy requested with revision $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy and verify production
    needs: validate
    if: ${{ needs.validate.outputs.deploy_required == 'true' }}
    runs-on: ubuntu-latest
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      API_DEPLOY_REQUIRED: ${{ needs.validate.outputs.api_deploy_required }}
    steps:
      - name: Explain missing Coolify secrets
        if: ${{ env.COOLIFY_WEBHOOK == '' || env.COOLIFY_TOKEN == '' }}
        run: |
          {
            echo '## Verifying Coolify Git deployment'
            echo 'Coolify trigger secrets are absent. Waiting for the Git repository deployment and checking revision manifests on the production domain.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Queue Coolify deployment
        if: ${{ env.COOLIFY_WEBHOOK != '' && env.COOLIFY_TOKEN != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK }}
          API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --max-time 30 --retry 2 --retry-all-errors --request GET "$WEBHOOK_URL" --header "Authorization: Bearer $API_TOKEN")"
          if [[ "$status" != 2* ]]; then
            echo "Coolify recusou o deploy (HTTP $status). Confira os secrets e o webhook configurado." >&2
            exit 1
          fi
          echo 'Coolify aceitou o pedido de deploy.' >> "$GITHUB_STEP_SUMMARY"
          rm -f "$response_file"

      - name: Verify deployed app, API route, and commit revision
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            health_json="$(curl --silent --show-error --fail --max-time 10 https://focussdev.space/api/health || true)"
            api_health=''
            api_revision=''
            if [[ -n "$health_json" ]]; then
              api_health="$(printf '%s' "$health_json" | jq -r '.status // empty')"
              api_revision="$(printf '%s' "$health_json" | jq -r '.revision // empty')"
            fi
            route_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 'https://focussdev.space/api/integrations/google/calendar/events?from=2026-09-30&to=2026-09-30' || true)"
            web_revision="$(curl --silent --show-error --fail --max-time 10 https://focussdev.space/nexo-build.json | jq -r '.revision // empty' || true)"
            html="$(curl --silent --show-error --fail --max-time 10 https://focussdev.space || true)"
            main_asset="$(printf '%s' "$html" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -n 1 || true)"
            main_asset_status=''
            if [[ -n "$main_asset" ]]; then
              main_asset_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "https://focussdev.space$main_asset" || true)"
            fi
            api_revision_ok='true'
            if [[ "$API_DEPLOY_REQUIRED" == 'true' && "$api_revision" != "$GITHUB_SHA" ]]; then
              api_revision_ok='false'
            fi
            if [[ "$api_health" == 'ok' && "$api_revision_ok" == 'true' && "$web_revision" == "$GITHUB_SHA" && "$route_status" == '401' && "$main_asset_status" == '200' ]]; then
              echo "App e API saudáveis; rota autenticada e manifests web/API confirmam o commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'O deploy foi enfileirado, mas a API/rota não ficou pronta dentro do prazo.' >&2
          exit 1
