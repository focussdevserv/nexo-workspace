name: Validate and deploy Nexo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and API checks
    runs-on: ubuntu-latest
    outputs:
      web_main_asset: ${{ steps.web_assets.outputs.main_asset }}
      web_commercial_asset: ${{ steps.web_assets.outputs.commercial_asset }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Record expected production assets
        id: web_assets
        shell: bash
        run: |
          set -euo pipefail
          main_asset="$(grep -oE 'index-[A-Za-z0-9_-]+\.js' dist/index.html | head -n 1)"
          test -n "$main_asset"
          main_bundle="dist/assets/$main_asset"
          commercial_asset="$(grep -oE 'CommercialScreens-[A-Za-z0-9_-]+\.js' "$main_bundle" | head -n 1)"
          test -n "$commercial_asset"
          echo "main_asset=$main_asset" >> "$GITHUB_OUTPUT"
          echo "commercial_asset=$commercial_asset" >> "$GITHUB_OUTPUT"
          echo "Expected frontend assets: $main_asset and $commercial_asset" >> "$GITHUB_STEP_SUMMARY"

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Build API
        run: npm run api:build

      - name: Run API tests
        run: npm --prefix api test

  deploy:
    name: Deploy and verify production
    needs: validate
    runs-on: ubuntu-latest
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      EXPECTED_MAIN_ASSET: ${{ needs.validate.outputs.web_main_asset }}
      EXPECTED_COMMERCIAL_ASSET: ${{ needs.validate.outputs.web_commercial_asset }}
    steps:
      - name: Explain missing Coolify secrets
        if: ${{ env.COOLIFY_WEBHOOK == '' || env.COOLIFY_TOKEN == '' }}
        run: |
          {
            echo '## Verifying Coolify Git deployment'
            echo 'Coolify trigger secrets are absent. Waiting for the configured Git repository integration to publish this commit and verifying the exact built assets on the production domain.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Queue Coolify deployment
        if: ${{ env.COOLIFY_WEBHOOK != '' && env.COOLIFY_TOKEN != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK }}
          API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --max-time 30 --retry 2 --retry-all-errors --request GET "$WEBHOOK_URL" --header "Authorization: Bearer $API_TOKEN")"
          if [[ "$status" != 2* ]]; then
            echo "Coolify recusou o deploy (HTTP $status). Confira os secrets e o webhook configurado." >&2
            exit 1
          fi
          echo 'Coolify aceitou o pedido de deploy.' >> "$GITHUB_STEP_SUMMARY"
          rm -f "$response_file"

      - name: Verify deployed app, API route, and exact assets
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            api_health="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 https://focussdev.space/api/health || true)"
            route_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 'https://focussdev.space/api/integrations/google/calendar/events?from=2026-09-30&to=2026-09-30' || true)"
            expected_assets_published='false'
            if [[ "$api_health" == '200' && "$route_status" == '401' ]]; then
              html="$(curl --silent --show-error --fail --max-time 10 https://focussdev.space || true)"
              main_asset="$(printf '%s' "$html" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -n 1 || true)"
              if [[ "$main_asset" == "/assets/$EXPECTED_MAIN_ASSET" ]]; then
                main_bundle="$(curl --silent --show-error --fail --max-time 10 "https://focussdev.space$main_asset" || true)"
                if printf '%s' "$main_bundle" | grep -Fq "$EXPECTED_COMMERCIAL_ASSET" && curl --silent --show-error --fail --max-time 10 "https://focussdev.space/assets/$EXPECTED_COMMERCIAL_ASSET" -o /dev/null; then
                  expected_assets_published='true'
                fi
              fi
            fi
            if [[ "$api_health" == '200' && "$route_status" == '401' && "$expected_assets_published" == 'true' ]]; then
              echo "App e API saudáveis; rota autenticada e os assets esperados ($EXPECTED_MAIN_ASSET, $EXPECTED_COMMERCIAL_ASSET) estão publicados." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'O deploy foi enfileirado, mas a API/rota não ficou pronta dentro do prazo.' >&2
          exit 1
