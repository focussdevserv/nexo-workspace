services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgres://nexo:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/nexo
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no Coolify}
      OWNER_EMAIL: ${OWNER_EMAIL:-contato@focussdev.art}
      APP_ORIGIN: ${APP_ORIGIN:-https://focussdev.space}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      WAHA_API_URL: ${WAHA_API_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:?Configure WAHA_API_KEY in Coolify}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://focussdev.space/api/integrations/google/callback}
      CLICKSIGN_API_TOKEN: ${CLICKSIGN_API_TOKEN:-}
      CLICKSIGN_API_BASE_URL: ${CLICKSIGN_API_BASE_URL:-https://sandbox.clicksign.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_EDITOR_BASE_URL: ${SERVICE_URL_N8N_5678:-https://n8n.pagfocuss.tech/}
      SENTRY_DSN: ${SENTRY_DSN:-}
      TRUST_PROXY: "true"
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      waha:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MERCADOPAGO_PUBLIC_KEY: ${VITE_MERCADOPAGO_PUBLIC_KEY:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  waha:
    image: devlikeapro/waha:noweb-2026.9.1
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Configure WAHA_API_KEY in Coolify}
      WHATSAPP_HOOK_URL: https://focussdev.space/api/integrations/waha/webhook
      WHATSAPP_HOOK_EVENTS: message,message.ack
      WHATSAPP_HOOK_CUSTOM_HEADERS: X-Nexo-WAHA-Token:${WAHA_API_KEY:?Configure WAHA_API_KEY in Coolify}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      WHATSAPP_DEFAULT_ENGINE: NOWEB
    expose:
      - "3000"
    volumes:
      - waha_sessions:/app/.sessions

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.5
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: nexo
      DB_POSTGRESDB_USER: nexo
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${SERVICE_PASSWORD_64_N8N:?Coolify deve gerar e manter SERVICE_PASSWORD_64_N8N}
      SERVICE_URL_N8N_5678: /
      N8N_HOST: ${SERVICE_FQDN_N8N_5678:-n8n.pagfocuss.tech}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: ${SERVICE_URL_N8N_5678:-https://n8n.pagfocuss.tech/}
      WEBHOOK_URL: ${SERVICE_URL_N8N_5678:-https://n8n.pagfocuss.tech/}
      N8N_PROXY_HOPS: "1"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: ${N8N_INSTANCE_OWNER_MANAGED_BY_ENV:-false}
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_INSTANCE_OWNER_EMAIL:-}
      N8N_INSTANCE_OWNER_FIRST_NAME: ${N8N_INSTANCE_OWNER_FIRST_NAME:-}
      N8N_INSTANCE_OWNER_LAST_NAME: ${N8N_INSTANCE_OWNER_LAST_NAME:-}
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_INSTANCE_OWNER_PASSWORD_HASH:-}
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - nexo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexo_postgres:
  waha_sessions:
  n8n_data:
